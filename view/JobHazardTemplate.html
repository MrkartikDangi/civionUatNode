<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Job Hazard</title>
</head>

<body style="margin: 0; padding: 0; background-color: #eef1f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 50px 0;">
        <tr>
            <td align="center">
                <!-- Card Container -->
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.08);">

                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #3498db, #2c3e50); padding: 25px; text-align: center;">
                            <h1 style="margin: 0; font-size: 22px; color: #ffffff;">
                                Job Hazard Report
                            </h1>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 30px;">
                            <p style="font-size: 15px; color: #2c3e50;">
                                Hello,
                            </p>

                            <p style="font-size: 15px; color: #555555; line-height: 1.6;">
                                {{message}}
                            </p>

                            <p style="font-size: 14px; color: #555555; margin-top: 30px;">
                                Thanks,<br>
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f7f9fc; padding: 15px; text-align: center; font-size: 12px; color: #95a5a6;">
                            JHA Generated System
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
